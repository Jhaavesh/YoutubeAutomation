# ============================================================================
# YOUTUBE API QUOTA MANAGEMENT
# ============================================================================
# Current documented YouTube Data API model (verify in Google Cloud Console
# before changing): 100 search.list calls/day, 100 videos.insert calls/day,
# and 10,000 units/day for all other endpoints. All reset at midnight PT.
quota:
  daily_limit: 10000
  upload_daily_limit: 100
  search_daily_limit: 100
  reset_timezone: "America/Los_Angeles"
  costs:
    video_upload: 1600       # videos.insert costs 1600 general quota units
    video_update: 50
    video_list: 1
    search_list: 100         # search.list costs 100 units if the API is used
    thumbnail_set: 50
  alert_threshold_percent: 80
  reserve_buffer: 2000

# ============================================================================
# SOURCE VIDEO DOWNLOAD SETTINGS
# ============================================================================
download:
  search:
    max_results: 10
    extract_flat: true
    noplaylist: true
  format:
    long: "bestvideo[height<=1440]+bestaudio/best[height<=1080]/best"
    short: "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best"
  merge_output_format:
    long: "mkv"
    short: "mp4"
  trim:
    long_start_seconds: 5
    short_start_seconds: 10
    short_duration_seconds: 35  # Download extra for editing flexibility
  retries: 10
  fragment_retries: 10
  timeout_seconds: 30

# ============================================================================
# DEDUPLICATION SETTINGS
# ============================================================================
deduplication:
  max_used_source_ids: 1000  # Trim database after this many
  max_used_long_topics: 20
  skip_previously_used: true

# ============================================================================
# NETWORK & RETRY SETTINGS
# ============================================================================
network:
  internet_check:
    url: "https://www.google.com"
    timeout_seconds: 5
    max_wait_seconds: 300
    retry_interval_seconds: 10
  upload:
    chunksize_mb: 4  # For long videos
    chunksize_mb_short: 2
    resumable: true
    max_retries: 3
    retry_delay_seconds: 30

# ============================================================================
# STORAGE CLEANUP
# ============================================================================
cleanup:
  max_age_hours: 24
  delete_patterns:
    - "*.part"
    - "*.ytdl"
    - "*.tmp"
    - "raw_*"
  keep_recent_hours: 24

# ============================================================================
# LOCK FILE (Prevent concurrent runs)
# ============================================================================
lock:
  enabled: true
  check_pid: true

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file_enabled: true
  console_enabled: true
  max_log_size_mb: 10
  backup_count: 5

# ============================================================================
# AUTO THUMBNAIL SETTINGS (AI-generated thumbnails)
# ============================================================================
thumbnails:
  enabled: true
  generate_for_all: true  # Auto-generate for every video
  ab_test_variants: 2     # Create 2 variants for A/B testing
  style: "modern"         # Options: modern, bold, clean
  brand_color: "cyan"
  watermark_always: true  # Always show channel watermark

# ============================================================================
# SMART CONTENT ANALYSIS
# ============================================================================
content_analysis:
  auto_detect_highlights: true  # Use YouTube's highlight detection
  min_clip_duration: 10         # Minimum highlight clip duration (seconds)
  max_clips_per_search: 5       # Number of clips to analyze per video
  motion_threshold: 0.7         # Motion intensity filter (0.0-1.0)
  audio_peaks: true             # Detect audio peaks for action moments

# ============================================================================
# INTELLIGENT SCHEDULING
# ============================================================================
smart_scheduling:
  use_analytics: true           # Use past performance data
  lookback_days: 14             # Days to analyze past performance
  time_zone: "Asia/Kolkata"
  adaptive_spread: true         # Adjust spread based on past engagement
  weekday_boost: true           # Boost weekend content earlier

# ============================================================================
# ERROR RECOVERY & RETRY
# ============================================================================
retry:
  max_attempts: 3
  backoff_base: 60            # Base delay in seconds (doubles each retry)
  retry_on:
    - "network_error"
    - "quota_exceeded"
    - "upload_failed"
    - "ffmpeg_error"
  auto_reschedule: true         # Reschedule failed uploads
  fallback_topic: true          # Use different topic if one fails

# ============================================================================
# MONETIZATION & COLLABORATIONS
# ============================================================================
monetization:
  enabled: false                # Set true when ready for affiliate links
  track_affiliate_data: true    # Track link performance
  product_mentions: []          # List of products to feature
  affiliate_link_template: "https://amzn.to/XXXXX"  # Your affiliate shortlink

# ============================================================================
# ZERO-TOUCH DEPLOYMENT
# ============================================================================
deployment:
  mode: "auto"                    # Options: auto, manual, scheduled
  startup_check: true             # Check if already running on startup
  health_check_interval: 3600     # Health check every hour (seconds)
  auto_restart_on_failure: true   # Restart bot if it crashes
  notification_webhook: ""        # Slack/Discord webhook for alerts

# ============================================================================
# PUBLISH APPROVAL
# ============================================================================
# The current zero-touch workflow uploads as private with publishAt, so YouTube
# publishes automatically. Set required: true to upload as a private draft and
# wait for an explicit approval before scheduling or publishing.
approval:
  required: false
  auto_approve: true

# ============================================================================
# AI CONTENT INTELLIGENCE (optional)
# ============================================================================
# Basic mode uses deterministic local templates and needs no API key.
# Supported providers in later phases: openai_compatible, gemini, anthropic,
# ollama, none. Never put an API key in this file.
ai:
  enabled: false
  provider: "none"
  base_url: ""
  model: ""
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.7
  max_tokens: 1200
  timeout_seconds: 60
  cache_enabled: true

# ============================================================================
# YOUTUBE ANALYTICS (optional; requires re-authentication)
# ============================================================================
analytics:
  enabled: false
  lookback_days: 28
  cache_minutes: 60
  include_shorts: true

# ============================================================================
# CONTENT SOURCE POLICY
# ============================================================================
# IMPORTANT: Publishing third-party footage without permission is not safe.
# Keep a license record for every source you are allowed to publish. This
# phase adds the policy fields but does not yet block the existing downloader;
# the compliance gate will be enforced when the source library is introduced.
source_policy:
  enforce_license_manifest: false
  allow_external_downloads: true
  rights_confirmed: false
  manifest_file: "assets/footage/licenses.json"