# DON OF VICE CITY — Central Configuration
# All settings in one place for easy maintenance and multi-channel support
#
# This file is local and intentionally ignored by git.  See config.example.yaml
# for the documented template.

config_version: 2

# ============================================================================
# CHANNEL CONFIGURATION (Multi-channel ready)
# ============================================================================
channels:
  default: "donofvicecity2026"
  accounts:
    donofvicecity2026:
      name: "DON OF VICE CITY"
      token_file: "token.pickle"
      client_secret_file: "client_secret.json"
      channel_id: ""  # Auto-detected on first auth
      upload_defaults:
        category_id: "20"  # Gaming
        privacy_status: "private"  # For scheduling
        self_declared_made_for_kids: false
        language: "en"
        default_tags:
          - "gta6"
          - "gta 6"
          - "vice city"
          - "don of vice city"
          - "gaming"
          - "ps5 pro"
          - "rockstar games"

# ============================================================================
# PATHS & DIRECTORIES
# ============================================================================
paths:
  # Relative paths are resolved from the directory containing this file.
  base_dir: "."
  output_dir: "daily_generated"
  assets_audio: "assets/audio"
  assets_footage: "assets/footage"
  db_file: "autopilot_db.json"
  lock_file: "autopilot.lock"
  log_file: "autopilot.log"
  ledger_file: "upload_ledger.json"
  ffmpeg_exe: ""  # Leave empty to auto-detect from PATH
  ffprobe_exe: ""  # Auto-detected next to ffmpeg, or from PATH

# ============================================================================
# VIDEO SPECIFICATIONS
# ============================================================================
video:
  long:
    resolution: "2560x1440"  # actual long-video output
    fps: 60
    duration_range_seconds: [150, 180]  # 2.5 - 3 minutes
    crf: 18
    preset: "fast"
    audio_bitrate: "192k"
    audio_volume: 0.85
    color_grading:
      saturation: 1.12
      contrast: 1.05
    watermark:
      text: "DON OF VICE CITY"
      color: "cyan"
      font_size: 42
      position: "top_right"
      margin: 50

  short:
    resolution: "1080x1920"  # 9:16 vertical
    fps: 60
    duration_seconds: 26
    crf: 20
    preset: "fast"
    audio_bitrate: "192k"
    audio_volume: 0.9
    trim_start_seconds: 2
    watermark:
      text: "DON OF VICE CITY"
      color: "cyan"
      font_size: 36
      position: "bottom_center"
      y_position: 1740

  # Font fallbacks (Windows) - will auto-detect or use system default
  fonts:
    primary: "C:/Windows/Fonts/ariblk.ttf"  # Arial Black
    fallback: "C:/Windows/Fonts/impact.ttf"
    # If neither found, will use FFmpeg default font
    allow_default_fallback: true

# ============================================================================
# DAILY SCHEDULE (IST - India Standard Time)
# ============================================================================
schedule:
  timezone: "Asia/Kolkata"

  long_video:
    target_hour: 18  # 6:00 PM
    target_minute: 0
    min_lead_minutes: 15  # If past target, schedule at now + 15 min
    round_to_minutes: 5

  shorts:
    standard_slots:
      - slot_id: 1
        name: "Slot 1 (01:00 PM)"
        hour: 13
        minute: 0
      - slot_id: 2
        name: "Slot 2 (04:30 PM)"
        hour: 16
        minute: 30
      - slot_id: 3
        name: "Slot 3 (07:30 PM)"
        hour: 19
        minute: 30
      - slot_id: 4
        name: "Slot 4 (10:30 PM)"
        hour: 22
        minute: 30

    # Dynamic scheduling parameters
    min_first_lead_minutes: 20
    end_of_day_hour: 23
    end_of_day_minute: 30
    min_spread_hours: 1.5
    late_night_interval_hours: 2
    round_schedule_to_minutes: 5

